name: Build

on:
  workflow_call:
  push:

jobs:
  apple-darwin-aarch64:
    name: apple darwin aarch64
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: |
          mkdir build
          cd build
          which dotnet
          ls /usr/local/share/dotnet
          CC=clang CXX=clang++ cmake .. -DDOTNET_DIR=/usr/local/share/dotnet/sdk/8.0.413
          make
      - uses: actions/upload-artifact@v4
        with:
          name: netcoredbg-arm64
          path: build