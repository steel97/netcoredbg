name: Build

on:
  workflow_call:
  push:

jobs:
  apple-darwin-aarch64:
    name: apple darwin aarch64
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: |
          mkdir build
          cd build
          CC=clang CXX=clang++ cmake .. -DDOTNET_DIR=/Users/runner/.dotnet
          make
          file src/netcoredbg
      - uses: actions/upload-artifact@v4
        with:
          name: netcoredbg-arm64
          path: |
            src/netcoredbg
            src/libdbgshim.dylib
            src/ManagedPart.dll
            src/Microsoft.CodeAnalysis.CSharp.Scripting.dll
            src/Microsoft.CodeAnalysis.CSharp.dll
            src/Microsoft.CodeAnalysis.Scripting.dll
            src/Microsoft.CodeAnalysis.dll